<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noether</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="#/">Noether</a>
      <button id="refresh" type="button">Refresh</button>
    </header>
    <div class="layout">
      <nav id="repos" aria-label="Repositories">
        <p class="muted">Reading repositories…</p>
      </nav>
      <main id="detail" tabindex="-1">
        <p class="muted">Choose a repository.</p>
      </main>
    </div>
  </body>
</html>
